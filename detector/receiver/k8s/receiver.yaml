apiVersion: v1
kind: Namespace
metadata:
  name: warden-system
  labels:
    app.kubernetes.io/part-of: warden
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: detector-receiver
  namespace: warden-system
  labels:
    app.kubernetes.io/name: detector-receiver
    app.kubernetes.io/part-of: warden
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: detector-receiver
  template:
    metadata:
      labels:
        app.kubernetes.io/name: detector-receiver
        app.kubernetes.io/part-of: warden
    spec:
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: receiver
          image: detector-receiver:warden
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8000
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 192Mi
          env:
            - name: AGENT_URL
              value: "http://warden-agent.warden-system.svc:8001"
---
apiVersion: v1
kind: Service
metadata:
  name: detector-receiver
  namespace: warden-system
  labels:
    app.kubernetes.io/name: detector-receiver
    app.kubernetes.io/part-of: warden
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: detector-receiver
  ports:
    - name: http
      port: 8000
      targetPort: http
