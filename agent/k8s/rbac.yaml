apiVersion: v1
kind: ServiceAccount
metadata:
  name: warden-agent
  namespace: warden-system
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: warden-agent-reader
rules:
  - apiGroups: [""]
    resources: ["pods", "events"]
    verbs: ["get", "list", "watch", "delete"]
  - apiGroups: ["apps"]
    resources: ["deployments", "replicasets"]
    verbs: ["get", "list", "watch", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: warden-agent-reader-binding
subjects:
  - kind: ServiceAccount
    name: warden-agent
    namespace: warden-system
roleRef:
  kind: ClusterRole
  name: warden-agent-reader
  apiGroup: rbac.authorization.k8s.io
